plugins {
	id 'maven-publish'
	// 26.x 起 Minecraft 不再混淆，用 net.fabricmc.fabric-loom；
	// 1.20.x~1.21.x 仍需重映射，用 net.fabricmc.fabric-loom-remap。
	// 两者由 Loom 1.18.2 同时提供，所以整个版本区间可以共用一个 Loom 版本。
	id 'net.fabricmc.fabric-loom' version '1.18.2' apply false
	id 'net.fabricmc.fabric-loom-remap' version '1.18.2' apply false

	// https://github.com/ReplayMod/preprocessor 的 fork，支持 //#if MC>=260100 形式的条件语法
	id 'com.replaymod.preprocess' version 'a2223f4'
}

preprocess {
	// 相邻版本之间的额外重命名映射文件，未填写时为空文件，不阻塞构建
	strictExtraMappings = false

	// 预处理图只包含这 4 个 Mojmap 版本：
	//   1.21.11 <-> 26.1 <-> 26.2 <-> 26.3    （核心 = 26.3，见 versions/mainProject）
	// 1.20.1 ~ 1.21.10 不进入该图，改用独立源集构建
	// （见 common.gradle 的 standalone_source / use_yarn 分支）。
	def mc12111 = createNode('1.21.11', 1_21_11, '')
	def mc2601  = createNode('26.1',    26_01_00, '')
	def mc2602  = createNode('26.2',    26_02_00, '')
	def mc2603  = createNode('26.3',    26_03_00, '')

	// 链路方向：旧版本 link 到它的「上游/更新」版本，与上游 "Sync with x.y+" 的维护方式一致
	mc12111.link(mc2601, file('versions/mapping-1.21.11-26.1.txt'))
	mc2601.link(mc2602,  file('versions/mapping-26.1-26.2.txt'))
	mc2602.link(mc2603,  file('versions/mapping-26.2-26.3.txt'))

	for (final def node in getNodes()) {
		findProject(node.project).ext.mcVersion = node.mcVersion
	}
}

// 一次构建全部版本并把产物汇总到根 build/libs
tasks.register('buildAndGather') {
	subprojects {
		dependsOn project.tasks.named('build').get()
	}
	doFirst {
		println 'Gathering builds'
		def buildLibs = { p -> p.buildDir.toPath().resolve('libs') }
		delete fileTree(buildLibs(rootProject)) { include '*' }
		subprojects {
			copy {
				from(buildLibs(project)) {
					include '*.jar'
					exclude '*-dev.jar', '*-sources.jar'
				}
				into buildLibs(rootProject)
				duplicatesStrategy = DuplicatesStrategy.INCLUDE
			}
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << '-Xlint:-processing'
}
