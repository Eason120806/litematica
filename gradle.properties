# Gradle 运行参数
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# 模组基础属性（所有版本共用；逐版本差异见 versions/<ver>/gradle.properties）
group=fi.dy.masa
mod_id=litematica
mod_name=Litematica
mod_file_name=litematica-fabric

# 统一版本号：全部 14 个版本共用一个 mod 版本，改这里即可，不要在 versions/*/ 下覆盖
mod_version=0.92.2
