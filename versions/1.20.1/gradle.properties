# Minecraft 1.20.1 | 产物后缀 1.20.1
# 逐版本差异集中在此文件；全局属性见根 gradle.properties

# 版本核心属性
minecraft_version=1.20.1
minecraft_version_out=1.20.1
loader_version=0.14.21
malilib_version=0.16.0

# fabric.mod.json 模板值（depends / breaks，按上游真实声明）
minecraft_dependency=1.20.1
malilib_dependency=0.16.x

# 可选依赖
mod_menu_version=7.0.1

# 独立源集模式（仅 1.20.1~1.21.10 的 10 个 Yarn 版本）
standalone_source=true
use_yarn=true
mc_code=12001
mappings_version=1.20.1+build.2

# 运行用 JDK（Gradle 自身固定 JDK 25；1.20.x 的 Mixin 读不了 25 的 class）
run_java_version=21
